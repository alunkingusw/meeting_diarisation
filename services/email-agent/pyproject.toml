[project]
name = "group-assessment-agent"
version = "0.1.0"
description = "Email-based interface for the local speaker diarisation / group meeting transcription system"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "tenacity>=8.2",
    "msal>=1.28",
    "python-dateutil>=2.9",
    "jinja2>=3.1",
    "werkzeug>=3.0",
    "python-dotenv>=1.0",
    "attrs>=22.2",
    "langchain-core==1.6.3",
    "langgraph>=0.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "freezegun>=1.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a live external service (e.g. Ollama) - opt in via RUN_OLLAMA_TESTS=1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
weekly-project-update = "app.weekly_update:main"

[tool.setuptools.packages.find]
include = ["app*"]
