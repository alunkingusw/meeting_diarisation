services:
  # Named "agent", not "app" - meeting_diarisation's own
  # docker-compose.yml already uses the service key "app" for itself, which
  # collides when both are combined by ../deploy/docker-compose.yml's `include:`.
  agent:
    container_name: group-assessment-agent
    build: .
    env_file: .env
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ./config/config.yaml:/app/config/config.yaml:ro
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

# Shared with meeting_diarisation's own docker-compose.yml - see
# the matching comment there for why. Created once with `docker network create project_net`
# before either project is brought up.
networks:
  default:
    name: project_net
    external: true
