services:
  api:
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        HUGGING_FACE_TOKEN: $(HUGGING_FACE_TOKEN)
    container_name: diarisation-api
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/backend/uploads
      - ./transcript_chroma:/backend/transcript_chroma
    depends_on:
      - db
    env_file:
      - .env
    command: bash -c "alembic upgrade head && uvicorn backend.main:backend --host 0.0.0.0 --port 8000"
    

  db:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - db

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: diarisation-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api

volumes:
  # Pinned to an explicit name, not left to Compose's default (which prefixes it with the
  # invoking compose project's name - "meeting_diarisation" run standalone from this
  # directory, but "deploy" if brought up via ../deploy/docker-compose.yml's `include:`).
  # Without this, the two invocation styles would silently resolve to two different volumes,
  # and running via the umbrella file would start against an empty database.
  postgres_data:
    name: meeting_diarisation_postgres_data

# Shared with GitHub-RAGinator and GroupAssessmentAgent's own docker-compose.yml files - see
# the matching comment there for why. Created once with `docker network create project_net`
# before any of the three projects are brought up.
networks:
  default:
    name: project_net
    external: true
